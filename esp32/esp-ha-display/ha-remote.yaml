# Home Assistant remote on a 4" ESP32-32E display board (ESP32-WROOM, CH340 USB):
# 480x320 ST7796 screen + XPT2046 touch, both on the same SPI bus, backlight on GPIO27.
# Six tiles; each shows its entity's state (amber = on) and toggles it when tapped.

esphome:
  name: ha-remote
  friendly_name: HA Remote

esp32:
  board: esp32dev

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: {}   # reuses the api encryption key

# The screen and the touch chip share one SPI bus (separate chip-select pins).
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin:
    number: GPIO12
    ignore_strapping_warning: true   # fine as an input after boot

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO27

light:
  - platform: monochromatic
    id: backlight
    name: Backlight
    output: backlight_pwm
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: screen
    model: ST7796
    data_rate: 40MHz
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO2
      ignore_strapping_warning: true
    auto_clear_enabled: false
    update_interval: never

touchscreen:
  - platform: xpt2046
    id: touch
    display: screen
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    # Calibrated against the panel's native portrait orientation (320x480);
    # LVGL's rotation: 90 then rotates touch together with the picture.
    calibration:
      x_min: 690
      x_max: 3170
      y_min: 710
      y_max: 3610
    transform:
      mirror_y: true
    on_touch:
      - logger.log:
          format: "touch x=%d y=%d raw_x=%d raw_y=%d"
          args: [touch.x, touch.y, touch.x_raw, touch.y_raw]

# Each tile follows its entity's state: checked (amber) when on, greyed out when unavailable.
text_sensor:
  - platform: homeassistant
    id: ha_living
    entity_id: switch.relay_controler_switch
    on_value:
      - lvgl.widget.update:
          id: btn_living
          state:
            checked: !lambda 'return x != "off" && x != "unavailable" && x != "unknown";'
            disabled: !lambda 'return x == "unavailable";'
  - platform: homeassistant
    id: ha_kitchen
    entity_id: switch.kitchen_lights_switch
    on_value:
      - lvgl.widget.update:
          id: btn_kitchen
          state:
            checked: !lambda 'return x != "off" && x != "unavailable" && x != "unknown";'
            disabled: !lambda 'return x == "unavailable";'
  - platform: homeassistant
    id: ha_lamp
    entity_id: switch.living_room_lamp_plug
    on_value:
      - lvgl.widget.update:
          id: btn_lamp
          state:
            checked: !lambda 'return x != "off" && x != "unavailable" && x != "unknown";'
            disabled: !lambda 'return x == "unavailable";'
  - platform: homeassistant
    id: ha_tvled
    entity_id: light.living_room_living_room_tv_led
    on_value:
      - lvgl.widget.update:
          id: btn_tvled
          state:
            checked: !lambda 'return x != "off" && x != "unavailable" && x != "unknown";'
            disabled: !lambda 'return x == "unavailable";'
  - platform: homeassistant
    id: ha_purifier
    entity_id: fan.xiaomi_cpa4_d0ea_air_purifier
    on_value:
      - lvgl.widget.update:
          id: btn_purifier
          state:
            checked: !lambda 'return x != "off" && x != "unavailable" && x != "unknown";'
            disabled: !lambda 'return x == "unavailable";'
  - platform: homeassistant
    id: ha_ac
    entity_id: climate.hallway_ac   # state is the HVAC mode (cool, heat, ...) or "off"
    on_value:
      - lvgl.widget.update:
          id: btn_ac
          state:
            checked: !lambda 'return x != "off" && x != "unavailable" && x != "unknown";'
            disabled: !lambda 'return x == "unavailable";'

lvgl:
  displays: [screen]
  buffer_size: 12%   # no PSRAM on this board; a full-screen buffer doesn't fit
  rotation: 90
  touchscreens: [touch]
  bg_color: 0x101418
  theme:
    button:
      bg_color: 0x2A323C
      text_color: 0xE0E0E0
      text_font: montserrat_24
      radius: 10
      checked:
        bg_color: 0xF5A623
        text_color: 0x101418
      disabled:
        bg_color: 0x1A1E22
        text_color: 0x505860
  pages:
    - id: main_page
      bg_color: 0x101418
      layout:
        type: GRID
        grid_columns: [FR(1), FR(1), FR(1)]
        grid_rows: [FR(1), FR(1)]
        pad_row: 10
        pad_column: 10
      pad_all: 10
      widgets:
        - button:
            id: btn_living
            grid_cell_column_pos: 0
            grid_cell_row_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label: { align: CENTER, text_align: CENTER, text: "Living Room\nLights" }
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data: { entity_id: switch.relay_controler_switch }
        - button:
            id: btn_kitchen
            grid_cell_column_pos: 1
            grid_cell_row_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label: { align: CENTER, text_align: CENTER, text: "Kitchen\nLights" }
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data: { entity_id: switch.kitchen_lights_switch }
        - button:
            id: btn_lamp
            grid_cell_column_pos: 2
            grid_cell_row_pos: 0
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label: { align: CENTER, text_align: CENTER, text: "Lamp" }
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data: { entity_id: switch.living_room_lamp_plug }
        - button:
            id: btn_tvled
            grid_cell_column_pos: 0
            grid_cell_row_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label: { align: CENTER, text_align: CENTER, text: "TV LED" }
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data: { entity_id: light.living_room_living_room_tv_led }
        - button:
            id: btn_purifier
            grid_cell_column_pos: 1
            grid_cell_row_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label: { align: CENTER, text_align: CENTER, text: "Air\nPurifier" }
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data: { entity_id: fan.xiaomi_cpa4_d0ea_air_purifier }
        - button:
            id: btn_ac
            grid_cell_column_pos: 2
            grid_cell_row_pos: 1
            grid_cell_x_align: STRETCH
            grid_cell_y_align: STRETCH
            widgets:
              - label: { align: CENTER, text_align: CENTER, text: "AC" }
            on_short_click:
              - homeassistant.action:
                  action: homeassistant.toggle
                  data: { entity_id: climate.hallway_ac }
